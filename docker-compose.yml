services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: greenvendor_db
    ports:
      - "1435:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "GreenVendor@123Password"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - gv_net
    
      
  api:
    build:
      context: ./backend
      dockerfile: GreenVendor.Api/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=GreenVendorDb;User Id=sa;Password=GreenVendor@123Password;TrustServerCertificate=True;
    depends_on:
      - db
    networks:
      - gv_net


  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    networks:
      - gv_net

networks:
  gv_net:

volumes:
  frontend_dist:
  mssql_data:

